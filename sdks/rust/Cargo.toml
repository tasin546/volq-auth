[package]
name = "volq-auth"
version = "1.0.0"
edition = "2021"
authors = ["VOLQ Auth Systems Team"]
description = "Hardened Rust client library for the VOLQ-Auth anti-tamper platform"

[dependencies]
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.21"
rand = "0.8"
